# Publica a documentação no GitHub Pages a cada push na main.
#
# O site é estático: o build roda aqui e o resultado vai para o Pages, de modo
# que a pasta `site/` nunca precisa ser versionada nem enviada à mão.
name: Publicar documentação

on:
  push:
    branches: [main]
  # Permite disparar manualmente pela aba Actions, sem precisar de um commit.
  workflow_dispatch:

# O token precisa poder escrever nas Pages; a identidade (id-token) é o que o
# deploy oficial usa para provar de onde o artefato veio.
permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez. `cancel-in-progress: false` deixa a que já começou
# terminar em vez de abortá-la no meio -- publicação parcial é pior que
# publicação atrasada.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Gerar o site
        # --strict transforma aviso em erro: link interno quebrado, página fora
        # do nav ou arquivo ausente derrubam a publicação em vez de irem ao ar.
        run: mkdocs build --strict

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
